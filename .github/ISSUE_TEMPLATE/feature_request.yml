---
name: Feature request
description: 新能力、性能优化、接口调整
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        这个项目的取舍很硬：**零运行时依赖、单写者、源码直跑**。
        提议被接受的常见形态是「在现有机制上加一格」，而不是「引入一层新东西」。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: 不要先讲方案。讲清楚现在哪件事做不了、代价多大
      placeholder: 打开 30 万行的库要 4 秒，因为每次都要重放 shell 段……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案，以及为什么不够
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 写路径 / 提交（committer, bufferpool）
        - 业务页表（pagetable）
        - 索引（bitmap, bizindex）
        - 索引快照（snapshot）
        - 文件格式（会动 format_ver）
        - CLI / stdio 协议
        - 压测与工具
        - 文档

  - type: checkboxes
    id: constraints
    attributes:
      label: 请确认
      options:
        - label: 这个方案不需要新增运行时依赖
          required: true
        - label: 我理解不满足「单测 + 变异测试」的 PR 不会被合并
          required: true
